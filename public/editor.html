<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10151b">
<title>ZOMBIX  — Редактор баз</title>
<style>
:root{--bg:#0b0f13;--panel:#121820;--panel2:#18212b;--line:#2b3947;--text:#edf2f7;--muted:#8e9aa8;--accent:#f4c542;--ok:#51d88a;--bad:#ff6675;--blue:#62a8ff;--radius:14px}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:#1a2430;color:var(--text);border-radius:10px;min-height:44px;padding:9px 12px;font-weight:700;touch-action:manipulation}button:active{transform:scale(.98)}button.primary{background:#3a300f;border-color:#8f7720;color:#ffe38a}button.ok{border-color:#2d8157;color:#8af0b5}button.danger{border-color:#8b3440;color:#ff8b96}button.small{min-height:38px;padding:7px 9px;font-size:12px}.app{max-width:1180px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:30;background:rgba(11,15,19,.96);backdrop-filter:blur(12px);padding:8px 0 10px}.topline{display:flex;align-items:center;gap:8px}.brand{font-size:17px;font-weight:900;flex:1}.brand span{color:var(--accent)}.help{color:var(--muted);font-size:12px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.tabs button{min-height:42px;font-size:12px}.tabs button.active{background:var(--accent);color:#15120a;border-color:#ffe9a0}.globalbar{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}.toolbar{display:flex;flex-wrap:wrap;gap:7px}.toolbar>*{flex:1 1 140px}.hint{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:17px;color:var(--accent)}.searchrow{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:7px;margin-top:10px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}.field label,.mini-label{font-size:11px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea,.mini-input{width:100%;min-height:42px;background:#0c1116;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px}.field textarea{min-height:72px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid5{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.section-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}.section-title h2{font-size:15px;margin:0}.section-title .count{color:var(--muted);font-size:12px}.item-list,.case-list,.house-list,.avatar-list,.reward-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.category-bar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}.cat-chip{flex:0 0 auto;min-height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0d1319;color:var(--text);font-size:11px;font-weight:800}.cat-chip.active{background:var(--accent);color:#15120a;border-color:#ffe9a0}.cat-admin{display:grid;grid-template-columns:1fr 1fr;gap:7px}.category-row{display:grid;grid-template-columns:42px 1fr auto;gap:7px;align-items:center;padding:8px;background:#0d1319;border:1px solid var(--line);border-radius:9px}.category-row .cat-count{font-size:11px;color:var(--muted)}.item-card,.case-card,.house-card,.avatar-card,.reward-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden}.item-head{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;padding:9px}.preview{display:block;width:54px;height:54px;background:#0b0f13;border:1px solid var(--line);border-radius:9px}.title{font-weight:900}.sub{font-size:11px;color:var(--muted);margin-top:2px}.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border:1px solid var(--line);border-radius:99px;font-size:10px;color:var(--muted);margin-top:4px}.item-body,.case-body,.house-body,.avatar-body,.reward-body{padding:10px;border-top:1px solid var(--line)}details summary{cursor:pointer;list-style:none;font-weight:800;color:#dce5ee}details summary::-webkit-details-marker{display:none}.summary-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tier{border-radius:7px;padding:4px 6px;font-weight:900;font-size:11px;text-align:center}.t1{color:#e7edf4;border-color:#aeb8c2;background:#2b333b}.t2{color:#7df39c;border-color:#3aa95a;background:#14351f}.t3{color:#72b8ff;border-color:#3477bb;background:#122b45}.t4{color:#dc8cff;border-color:#8849ad;background:#30183c}.t5{color:#ffae63;border-color:#b96722;background:#43230f}.t6{color:#e88999;border-color:#a33f50;background:#3d171e}.prices input{text-align:center}.case-head,.house-head,.avatar-head{display:grid;grid-template-columns:58px 1fr auto;gap:9px;align-items:center;padding:10px}.case-img,.house-img,.avatar-img{width:58px;height:58px;object-fit:contain;background:#0b0f13;border:1px solid var(--line);border-radius:10px}.case-actions,.card-actions{display:flex;gap:6px;flex-wrap:wrap}.case-actions button,.card-actions button{min-height:38px}.drop-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}.drop-row{display:grid;grid-template-columns:42px 1fr 1.35fr 62px 78px 42px;gap:6px;align-items:center;background:#0d1319;border:1px solid var(--line);border-radius:9px;padding:5px}.drop-row-atlas{display:block;width:36px;height:36px}.drop-row-atlas .item-atlas{display:block;width:100%;height:100%}.drop-row select,.drop-row input{width:100%;min-height:38px;background:#111820;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:5px;font-size:12px}.drop-row .chance{text-align:right}.sumline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding:8px;border-radius:8px;background:#0d1319}.sum-ok{color:var(--ok)}.sum-bad{color:var(--bad)}.required-list{display:flex;flex-direction:column;gap:6px}.req-row{display:grid;grid-template-columns:1fr 70px 70px 42px;gap:6px}.req-row select,.req-row input{min-height:40px;background:#0c1116;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px}.sticky-actions{position:sticky;bottom:8px;z-index:20;background:rgba(18,24,32,.96);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:10px;backdrop-filter:blur(10px)}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#16202a;border:1px solid var(--line);border-radius:10px;padding:10px 14px;z-index:100;color:var(--text);transition:.2s;max-width:92vw;text-align:center}.status.show{opacity:1;transform:translateX(-50%) translateY(0)}.status.ok{border-color:#2d8157;color:#9bf2bd}.status.bad{border-color:#8b3440;color:#ff9ba4}.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:80;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px}.sheet-head{display:flex;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--panel);padding:5px 0 12px;z-index:2}.sheet-head h3{margin:0;flex:1}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.file-input{display:none}.danger-note{padding:9px;border:1px solid #66303a;background:#241319;color:#ffadb5;border-radius:9px;font-size:12px}.guide{display:grid;gap:8px}.guide-step{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.guide-step b{color:var(--accent)}
@media(max-width:700px){.app{padding:7px}.tabs{grid-template-columns:repeat(6,minmax(78px,1fr));overflow-x:auto;padding-bottom:2px}.tabs button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.searchrow,.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(5,minmax(55px,1fr))}.grid6{grid-template-columns:repeat(3,minmax(75px,1fr))}.drop-row{grid-template-columns:34px 1fr 1.2fr 52px 62px 38px}.drop-row select,.drop-row input{font-size:11px}.case-head,.house-head,.avatar-head{grid-template-columns:50px 1fr auto}.case-img,.house-img,.avatar-img{width:50px;height:50px}.brand{font-size:15px}.help{display:none}.toolbar>*{flex:1 1 46%}.item-head{grid-template-columns:48px 1fr auto}.preview{width:48px;height:48px}.sheet{max-height:95vh}.req-row{grid-template-columns:1fr 62px 62px 40px}}
@media(max-width:430px){body{font-size:13px}.tabs{grid-template-columns:repeat(6,92px)}.globalbar{grid-template-columns:1fr}.drop-row{grid-template-columns:30px minmax(62px,1fr) minmax(90px,1.2fr) 48px 58px 36px}.drop-row-atlas{width:32px;height:32px}.case-actions button,.card-actions button{flex:1}.stats .stat b{font-size:15px}}
.atlas-preview{display:block;background-image:url("png/avatars-atlas.png");background-repeat:no-repeat;background-size:1600% 700%;}
.item-atlas{display:inline-block;background-image:url("png/items-atlas.png");background-repeat:no-repeat;background-size:1600% 1100%;image-rendering:pixelated;flex:none}.item-atlas-missing{background-image:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="topline"><div class="brand">ZOMBIX <span>РЕДАКТОР</span></div><div class="help">ручное редактирование</div><button class="small" id="fullscreenBtn">⛶</button></div>
  <nav class="tabs" id="tabs">
    <button class="active" data-tab="items">📦 Предметы</button><button data-tab="cases">🎁 Кейсы</button><button data-tab="houses">🏠 Дома</button><button data-tab="avatars">👤 Аватары</button><button data-tab="rewards">🎯 Награды</button><button data-tab="promos">🎟 Промокоды</button>
  </nav>
  <div class="globalbar"><button id="loadBtn">🔄 Из игры</button><button id="loadDraftBtn">📂 Черновик</button><button class="primary" id="saveDraftBtn">💾 Сохранить</button></div><div class="globalbar" style="margin-top:6px"><button class="ok" id="downloadZipBtn">📦 Скачать ВСЕ базы ZIP</button><button id="backupZipBtn">🛡 Быстрый бэкап</button><div id="draftState" class="hint" style="display:flex;align-items:center;justify-content:center">Черновик: готов</div></div>
</header>
<main>
<section id="tab-items" class="tab active"></section>
<section id="tab-cases" class="tab hidden"></section>
<section id="tab-houses" class="tab hidden"></section>
<section id="tab-avatars" class="tab hidden"></section>
<section id="tab-rewards" class="tab hidden"></section>
</main>
</div>
<div id="status" class="status"></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheet-head"><h3 id="modalTitle">Редактор</h3><button class="small" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<input id="filePicker" class="file-input" type="file" accept=".json,application/json">
<script src="js/item-atlas.js"></script>
<script>
'use strict';
const DB={items:{key:'items',file:'items.json'},cases:{key:'cases',file:'cases.json'},avatars:{key:'avatars',file:'avatars.json'},houses:{key:'levels',file:'house.json'},rewards:{key:'rewards',file:'daily_rewards.json'},promos:{key:'codes',file:'promo_codes.json'}};
const state={items:[],cases:[],avatars:[],houses:[],rewards:[],promos:[],categories:[],caseFilters:[],houseMeta:{maxLevel:30,maxCollectHours:4,backgrounds:[]}};
const filters={items:{q:'',cat:'all',tier:'all'},cases:{q:'',currency:'all',category:'all'},houses:{q:''},avatars:{q:''},rewards:{q:''}};
let importTarget=null;
let draftSaveTimer=null;
let draftDirty=false;
const DRAFT_KEY='zombixEditorV38';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,ok=true){const e=$('#status');e.textContent=msg;e.className='status show '+(ok?'ok':'bad');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='status',2200)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function money(n){return Number(n||0).toLocaleString('ru-RU')}
function itemById(id){return state.items.find(x=>Number(x.id)===Number(id))}
function catLabel(x){const c=state.categories.find(c=>String(c.id)===String(x?.category));return c?.name||x?.categoryLabel||x?.category||'Без категории'}
function ensureCategories(){state.categories=(Array.isArray(state.categories)?state.categories:[]).filter(c=>c&&String(c.id||'').trim()).map(c=>({id:String(c.id).trim(),name:String(c.name||c.id).trim()||String(c.id)}));for(const it of state.items){const id=String(it.category||'uncategorized').trim()||'uncategorized';if(!state.categories.some(c=>c.id===id)){state.categories.push({id,name:it.categoryLabel||id})}}if(!state.categories.length)state.categories=[{id:'uncategorized',name:'Без категории'}];state.categories.sort((a,b)=>a.name.localeCompare(b.name,'ru')||a.id.localeCompare(b.id,'ru'));for(const it of state.items){const id=String(it.category||'uncategorized').trim()||'uncategorized';it.category=id;it.categoryLabel=catLabel(it)}}
function categoriesSorted(){ensureCategories();return [...state.categories].sort((a,b)=>a.name.localeCompare(b.name,'ru')||a.id.localeCompare(b.id,'ru'))}
function categoryById(id){ensureCategories();return state.categories.find(c=>String(c.id)===String(id))||state.categories[0]}
function tierClass(t){return 't'+Math.max(1,Math.min(6,Number(t)||1))}
function tiersList(){return [1,2,3,4,5,6]}
function setDraftState(text,dirty=false){const e=$('#draftState');if(e){e.textContent='Черновик: '+text;e.style.color=dirty?'var(--accent)':'var(--ok)';}draftDirty=dirty}
function autoSaveDraft(){clearTimeout(draftSaveTimer);setDraftState('изменения…',true);draftSaveTimer=setTimeout(()=>{try{ensureCategories();localStorage.setItem(DRAFT_KEY,JSON.stringify(state));setDraftState('сохранён',false)}catch(e){setDraftState('ошибка',true);}},120)}
function saveDraft(silent=false){ensureCategories();localStorage.setItem(DRAFT_KEY,JSON.stringify(state));setDraftState('сохранён',false);if(!silent)toast('Черновик сохранён в браузере')}
function tierColor(t){return ['#d7dce2','#51c96d','#4d9fff','#bd68e8','#ff8738','#A84C55'][Number(t)-1]||'#d7dce2'}
function optionItems(selected,category='all'){return state.items.filter(it=>category==='all'||String(it.category)===String(category)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ru')||Number(a.id)-Number(b.id)).map(it=>`<option value="${it.id}" ${Number(it.id)===Number(selected)?'selected':''}>${esc(it.name)} · ID ${it.id}</option>`).join('')}
function categoryOptions(selected='all',includeAll=true){return `${includeAll?`<option value="all">Все категории</option>`:''}${categoriesSorted().map(c=>`<option value="${esc(c.id)}" ${String(selected)===String(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}`}
function download(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Файл скачан: '+name)}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0}
function makeZip(files){const enc=new TextEncoder(), local=[], central=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);const lh=new Uint8Array(30+name.length);lh.set([0x50,0x4b,0x03,0x04],0);lh.set(u16(20),4);lh.set(u16(0),6);lh.set(u16(0),8);lh.set(u16(0),10);lh.set(u16(0),12);lh.set(u32(crc),14);lh.set(u32(data.length),18);lh.set(u32(data.length),22);lh.set(u16(name.length),26);lh.set(u16(0),28);lh.set(name,30);local.push(lh,data);const ch=new Uint8Array(46+name.length);ch.set([0x50,0x4b,0x01,0x02],0);ch.set(u16(20),4);ch.set(u16(20),6);ch.set(u16(0),8);ch.set(u16(0),10);ch.set(u16(0),12);ch.set(u16(0),14);ch.set(u32(crc),16);ch.set(u32(data.length),20);ch.set(u32(data.length),24);ch.set(u16(name.length),28);ch.set(u16(0),30);ch.set(u16(0),32);ch.set(u16(0),34);ch.set(u16(0),36);ch.set(u32(0),38);ch.set(u32(offset),42);ch.set(name,46);central.push(ch);offset+=lh.length+data.length}const centralSize=central.reduce((n,x)=>n+x.length,0),end=new Uint8Array(22);end.set([0x50,0x4b,0x05,0x06],0);end.set(u16(0),4);end.set(u16(0),6);end.set(u16(files.length),8);end.set(u16(files.length),10);end.set(u32(centralSize),12);end.set(u32(offset),16);end.set(u16(0),20);return new Blob([...local,...central,end],{type:'application/zip'})}
function allDatabaseFiles(){ensureCategories();return [
 {name:'data/items.json',data:JSON.stringify({categories:categoriesSorted(),items:state.items},null,2)},
 {name:'data/cases.json',data:JSON.stringify({filterCategories:state.caseFilters||[],cases:state.cases},null,2)},
 {name:'data/avatars.json',data:JSON.stringify({avatars:state.avatars},null,2)},
 {name:'data/house.json',data:JSON.stringify({...state.houseMeta,levels:state.houses},null,2)},
 {name:'data/daily_rewards.json',data:JSON.stringify({cycleDays:30,timezone:'Europe/Moscow',rewards:state.rewards},null,2)},
 {name:'data/promo_codes.json',data:JSON.stringify({version:1,codes:state.promos||[]},null,2)}
]}
function downloadAllZip(label='базы'){saveDraft(true);const blob=makeZip(allDatabaseFiles());const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zombix_databases_'+new Date().toISOString().slice(0,10)+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('ZIP всех баз скачан')}
function exportDb(type){ensureCategories();if(type==='items')download({categories:categoriesSorted(),items:state.items},'items.json');if(type==='cases')download({filterCategories:state.caseFilters||[],cases:state.cases},'cases.json');if(type==='avatars')download({avatars:state.avatars},'avatars.json');if(type==='houses')download({...state.houseMeta,levels:state.houses},'house.json');if(type==='rewards')download({cycleDays:30,timezone:'Europe/Moscow',rewards:state.rewards},'daily_rewards.json');if(type==='promos')download({version:1,codes:state.promos||[]},'promo_codes.json')}

function loadDraft(){const raw=localStorage.getItem(DRAFT_KEY)||localStorage.getItem('zombixEditorV25')||localStorage.getItem('zombixEditorV23');if(!raw){toast('Черновика пока нет',false);return}try{const d=JSON.parse(raw);Object.assign(state,d);ensureCategories();renderAll();setDraftState('загружен',false);toast('Черновик загружен')}catch(e){toast('Черновик повреждён',false)}}
async function loadGameData(){try{const [i,c,a,h,r]=await Promise.all(['items','cases','avatars','houses','rewards'].map(k=>fetch('data/'+DB[k].file,{cache:'no-store'})));if(!i.ok||!c.ok||!a.ok||!h.ok||!r.ok)throw Error('Одна из публичных баз не найдена');const [ij,cj,aj,hj,rj]=await Promise.all([i.json(),c.json(),a.json(),h.json(),r.json()]);state.items=ij.items||[];state.categories=ij.categories||[];ensureCategories();state.caseFilters=cj.filterCategories||[];state.cases=cj.cases||[];state.avatars=aj.avatars||[];state.houses=hj.levels||[];state.houseMeta={maxLevel:hj.maxLevel??30,maxCollectHours:hj.maxCollectHours??4,backgrounds:hj.backgrounds||[]};state.rewards=rj.rewards||[];renderAll();toast('Публичные базы загружены. Промокоды импортируй отдельно из приватного файла.')}catch(e){toast('Не удалось загрузить: '+e.message,false)}}
function importJson(type){importTarget=type;$('#filePicker').value='';$('#filePicker').click()}
$('#filePicker').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!importTarget)return;try{const d=JSON.parse(await f.text());if(importTarget==='items'){state.items=d.items||[];state.categories=d.categories||[];ensureCategories();}if(importTarget==='cases'){state.caseFilters=d.filterCategories||[];state.cases=d.cases||[];}if(importTarget==='avatars')state.avatars=d.avatars||[];if(importTarget==='houses'){state.houses=d.levels||[];state.houseMeta={maxLevel:d.maxLevel??30,maxCollectHours:d.maxCollectHours??4,backgrounds:d.backgrounds||[]}}if(importTarget==='rewards')state.rewards=d.rewards||[];if(importTarget==='promos')state.promos=d.codes||[];renderAll();toast('Импортировано: '+f.name)}catch(err){toast('Ошибка JSON: '+err.message,false)}});
function tabSwitch(name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('hidden',s.id!=='tab-'+name))}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)tabSwitch(b.dataset.tab)});
$('#loadBtn').onclick=()=>{if(draftDirty&&!confirm('Есть несохранённые изменения. Загрузить базы из игры и заменить текущий черновик?'))return;loadGameData()};$('#loadDraftBtn').onclick=loadDraft;$('#saveDraftBtn').onclick=()=>saveDraft();$('#downloadZipBtn').onclick=()=>downloadAllZip();$('#backupZipBtn').onclick=()=>downloadAllZip('бэкап');$('#fullscreenBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();

function commonHeader(title,count,buttons){return `<div class="card"><div class="section-title"><h2>${title}</h2><span class="count">${count}</span><span style="flex:1"></span>${buttons||''}</div></div>`}
function renderCategoryManager(){
 const cats=categoriesSorted();
 openModal('Категории предметов',()=>`<div class="hint" style="margin-bottom:10px">Категория влияет только на сортировку и удобство редактора. ID предметов могут быть любыми и не обязаны идти подряд.</div><div class="category-admin"><div class="field"><label>ID новой категории</label><input id="newCatId" placeholder="например: tools"></div><div class="field"><label>Название</label><input id="newCatName" placeholder="Инструменты"></div></div><div class="sticky-actions"><button class="ok" id="addCategoryBtn">＋ Создать категорию</button></div><div style="display:flex;flex-direction:column;gap:6px;margin-top:10px" id="categoryEditor">${cats.map((c,i)=>`<div class="category-row"><div class="cat-count">${state.items.filter(it=>String(it.category)===String(c.id)).length}</div><div><div class="title">${esc(c.name)}</div><div class="sub">ID: ${esc(c.id)}</div></div><div class="card-actions"><button class="small" data-edit-cat="${esc(c.id)}">✏️</button><button class="small danger" data-del-cat="${esc(c.id)}">✕</button></div></div>`).join('')}</div><div class="sticky-actions"><button id="catClose">Закрыть</button></div>`);
 setTimeout(()=>{
  $('#addCategoryBtn').onclick=()=>{const id=slug($('#newCatId').value);const name=$('#newCatName').value.trim();if(!id||!name){toast('Укажи ID и название категории',false);return}if(state.categories.some(c=>c.id===id)){toast('Такая категория уже есть',false);return}state.categories.push({id,name});ensureCategories();closeModal();renderItems();autoSaveDraft();toast('Категория создана')};
  document.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>editCategory(b.dataset.editCat));
  document.querySelectorAll('[data-del-cat]').forEach(b=>b.onclick=()=>deleteCategory(b.dataset.delCat));
  $('#catClose').onclick=closeModal;
 },0)
}
function slug(v){return String(v||'').trim().toLowerCase().replace(/[^a-z0-9а-яё_-]+/gi,'_').replace(/^_+|_+$/g,'').slice(0,40)}
function editCategory(id){const c=categoryById(id);if(!c)return;openModal('Категория · '+c.name,()=>`<div class="field"><label>ID категории</label><input id="catEditId" value="${esc(c.id)}"></div><div class="field"><label>Название</label><input id="catEditName" value="${esc(c.name)}"></div><div class="sticky-actions"><div class="card-actions"><button class="ok" id="catSave">💾 Сохранить</button><button id="catCancel">Отмена</button></div></div>`);setTimeout(()=>{$('#catSave').onclick=()=>{const nid=slug($('#catEditId').value),name=$('#catEditName').value.trim()||c.name;if(!nid){toast('Некорректный ID',false);return}if(nid!==c.id&&state.categories.some(x=>x.id===nid)){toast('Такой ID уже занят',false);return}const old=c.id;c.id=nid;c.name=name;state.items.forEach(it=>{if(String(it.category)===String(old)){it.category=nid;it.categoryLabel=name}});ensureCategories();closeModal();renderItems();autoSaveDraft();toast('Категория сохранена')};$('#catCancel').onclick=closeModal},0)}
function deleteCategory(id){const c=categoryById(id);if(!c)return;if(state.categories.length<=1){toast('Нельзя удалить последнюю категорию',false);return}const count=state.items.filter(it=>String(it.category)===String(id)).length;const fallback=categoriesSorted().find(x=>x.id!==id);if(!confirm(`Удалить категорию «${c.name}»?\n${count} предмет(ов) будут перенесены в «${fallback.name}».`))return;state.items.forEach(it=>{if(String(it.category)===String(id)){it.category=fallback.id;it.categoryLabel=fallback.name}});state.categories=state.categories.filter(x=>x.id!==id);ensureCategories();filters.items.cat='all';closeModal();renderItems();autoSaveDraft();toast('Категория удалена')}
function renderItems(){
 ensureCategories();const f=filters.items;let arr=state.items.filter(it=>{const q=f.q.toLowerCase();return(!q||(String(it.id).includes(q)||String(it.name||'').toLowerCase().includes(q)))&&(f.cat==='all'||it.category===f.cat)&&(f.tier==='all'||Object.prototype.hasOwnProperty.call(it.tiers||{},f.tier))});
 const cats=categoriesSorted();arr.sort((a,b)=>{const ca=categoryById(a.category),cb=categoryById(b.category);return ca?.name.localeCompare(cb?.name,'ru')||String(a.name||'').localeCompare(String(b.name||''),'ru')||Number(a.id)-Number(b.id)});
 $('#tab-items').innerHTML=`<div class="card"><div class="section-title"><h2>📦 Предметы</h2><span class="count">${arr.length}/${state.items.length}</span><span style="flex:1"></span><button class="small" id="manageCats">🗂 Категории</button><button class="small ok" id="addItem">＋ Предмет</button></div><div class="hint">Предметы автоматически группируются по категориям. ID можно ставить любые. Меняй категорию, название, картинку и 6 цен прямо в карточке.</div><div class="category-bar" id="itemCategoryBar"><button class="cat-chip ${f.cat==='all'?'active':''}" data-cat="all">Все · ${state.items.length}</button>${cats.map(c=>`<button class="cat-chip ${f.cat===c.id?'active':''}" data-cat="${esc(c.id)}">${esc(c.name)} · ${state.items.filter(it=>String(it.category)===String(c.id)).length}</button>`).join('')}</div><div class="toolbar" style="margin-top:8px"><button class="small" id="itemImport">📥 Импорт items.json</button><button class="small" id="itemExport">💾 Скачать items.json</button></div><div class="searchrow"><input id="itemQ" placeholder="🔎 Поиск по имени или ID" value="${esc(f.q)}"><select id="itemCat">${categoryOptions(f.cat)}</select><select id="itemTier"><option value="all">Все тиры</option>${tiersList().map(t=>`<option value="${t}" ${String(f.tier)===String(t)?'selected':''}>Тир ${t}</option>`).join('')}</select></div><div class="stats"><div class="stat"><b>${state.items.length}</b>предметов</div><div class="stat"><b>6</b>тиров</div><div class="stat"><b>${cats.length}</b>категорий</div><div class="stat"><b>${state.cases.length}</b>кейсов</div></div></div><div class="item-list">${arr.map(it=>itemCard(it)).join('')||'<div class="empty">Ничего не найдено.</div>'}</div>`;
 $('#manageCats').onclick=renderCategoryManager;$('#itemImport').onclick=()=>importJson('items');$('#itemExport').onclick=()=>exportDb('items');$('#itemQ').oninput=e=>{f.q=e.target.value;renderItems()};$('#itemCat').onchange=e=>{f.cat=e.target.value;renderItems()};$('#itemTier').onchange=e=>{f.tier=e.target.value;renderItems()};$('#addItem').onclick=()=>editItem(-1);document.querySelectorAll('#itemCategoryBar [data-cat]').forEach(b=>b.onclick=()=>{f.cat=b.dataset.cat;renderItems()});document.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>editItem(Number(b.dataset.editItem)));document.querySelectorAll('[data-del-item]').forEach(b=>b.onclick=()=>{const i=state.items.findIndex(x=>Number(x.id)===Number(b.dataset.delItem));if(i>=0&&confirm('Удалить предмет ID '+state.items[i].id+'?')){state.items.splice(i,1);renderItems();autoSaveDraft();toast('Предмет удалён')}})
}
function itemCard(it){return `<article class="item-card"><div class="item-head">${itemSprite(it.image||it.id,'preview')}<div><div class="title">${esc(it.name||'Без названия')}</div><div class="sub">ID ${it.id} · ${esc(catLabel(it))}</div><span class="badge">${esc(it.image||'нет картинки')}</span></div><button class="small" data-edit-item="${it.id}">✏️</button></div><details><summary style="padding:0 10px 10px">Показать цены тиров</summary><div class="item-body"><div class="grid6 prices">${tiersList().map(t=>`<div><div class="tier ${tierClass(t)}">T${t}</div><input class="mini-input" value="${it.tiers?.[String(t)]?.price??0}" disabled></div>`).join('')}</div></div></details></article>`}
function editItem(index){ensureCategories();const defaultCat=categoriesSorted()[0]?.id||'uncategorized';const defaultLabel=categoryById(defaultCat)?.name||'Без категории';const it=index<0?{id:Math.max(0,...state.items.map(x=>Number(x.id)||0))+1,name:'Новый предмет',image:'png/items/items_'+(Math.max(0,...state.items.map(x=>Number(x.id)||0))+1)+'.png',category:defaultCat,categoryLabel:defaultLabel,tiers:{'1':{price:10},'2':{price:30},'3':{price:100},'4':{price:300},'5':{price:1000},'6':{price:4000}}}:clone(state.items.find(x=>Number(x.id)===index));if(!it)return;openModal('Предмет · ID '+it.id,()=>itemForm(it,index<0));setTimeout(()=>{$('#mSave').onclick=saveItemFromModal;$('#mCancel').onclick=closeModal},0)}
function itemForm(it,isNew){ensureCategories();return `<div class="grid2"><div class="field"><label>Название — лучше одно слово</label><input id="mName" value="${esc(it.name)}"></div><div class="field"><label>ID предмета</label><input id="mId" type="number" value="${it.id}"></div></div><div class="field"><label>Картинка (путь внутри public)</label><input id="mImage" value="${esc(it.image)}"></div><div class="field"><label>Категория</label><select id="mCat">${categoryOptions(it.category,false)}</select></div><div class="card" style="margin-top:4px"><div class="section-title"><h2>Цены по тирам</h2></div><div class="grid6">${tiersList().map(t=>`<div class="field"><label class="tier ${tierClass(t)}">T${t}</label><input id="mT${t}" type="number" min="0" value="${it.tiers?.[String(t)]?.price??0}"></div>`).join('')}</div></div><div class="sticky-actions"><div class="card-actions"><button class="ok" id="mSave">💾 Сохранить</button><button id="mCancel">Отмена</button></div></div>`}
function saveItemFromModal(){ensureCategories();const old=state.items.findIndex(x=>Number(x.id)===Number($('#mId').value));const it={id:Number($('#mId').value)||1,name:$('#mName').value.trim()||'Предмет',image:$('#mImage').value.trim(),category:$('#mCat').value,categoryLabel:categoryById($('#mCat').value)?.name||$('#mCat').value,tiers:{}};for(let t=1;t<=6;t++)it.tiers[t]={price:Math.max(0,Number($('#mT'+t).value)||0)};if(old>=0){state.items[old]=it}else state.items.push(it);closeModal();renderItems();autoSaveDraft();toast('Предмет сохранён')}
function ensureCaseFilters(){
  const seen=new Set();
  state.caseFilters=(Array.isArray(state.caseFilters)?state.caseFilters:[]).map(x=>({id:String(x?.id||'').trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_'),label:String(x?.label||'').trim().slice(0,32)})).filter(x=>x.id&&x.label&&!seen.has(x.id)&&seen.add(x.id));
}
function renderCaseCategoryManager(){
  ensureCaseFilters();
  openModal('Категории кейсов',()=>`<div class="hint">Категории хранятся прямо в <b>cases.json</b> в поле <code>filterCategories</code>. Можно добавлять, переименовывать и удалять свои разделы. Системные «Все», «Монеты», «Гемы», «Реклама» и «Доступные» оставить можно.</div><div class="category-list" style="margin-top:10px">${state.caseFilters.map((x,i)=>`<div class="category-row"><span class="cat-count">${i+1}</span><div><b>${esc(x.label)}</b><div class="sub">${esc(x.id)}</div></div><div style="display:flex;gap:5px"><button class="small" data-edit-case-filter="${esc(x.id)}">✎</button>${['all','coins','gems','ad','available'].includes(x.id)?'':`<button class="small danger" data-del-case-filter="${esc(x.id)}">✕</button>`}</div></div>`).join('')}</div><div class="sticky-actions"><div class="card-actions"><button class="ok" id="addCaseFilter">＋ Добавить категорию</button><button id="closeCaseFilter">Готово</button></div></div>`);
  setTimeout(()=>{
    $('#addCaseFilter').onclick=()=>{const raw=prompt('Название новой категории:');if(!raw)return;const label=raw.trim().slice(0,32);if(!label)return;let id=label.toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'_').replace(/[а-яё]/gi,'').replace(/^_+|_+$/g,'')||('custom_'+Date.now());id=id.toLowerCase();let n=2,base=id;while(state.caseFilters.some(x=>x.id===id))id=base+'_'+n++;state.caseFilters.push({id,label});autoSaveDraft();renderCaseCategoryManager();};
    document.querySelectorAll('[data-edit-case-filter]').forEach(b=>b.onclick=()=>{const id=b.dataset.editCaseFilter,x=state.caseFilters.find(v=>v.id===id);if(!x)return;const raw=prompt('Новое название:',x.label);if(raw===null)return;const label=raw.trim().slice(0,32);if(!label)return;x.label=label;autoSaveDraft();renderCaseCategoryManager();renderCases();});
    document.querySelectorAll('[data-del-case-filter]').forEach(b=>b.onclick=()=>{const id=b.dataset.delCaseFilter;if(!confirm('Удалить категорию? Кейсы этой категории будут переведены в «ВСЕ».'))return;state.caseFilters=state.caseFilters.filter(x=>x.id!==id);state.cases.forEach(c=>{if(String(c.category||'')===id)c.category='all'});autoSaveDraft();renderCaseCategoryManager();renderCases();});
    $('#closeCaseFilter').onclick=closeModal;
  },0);
}
function renderCases(){ensureCaseFilters();const f=filters.cases;let arr=state.cases.filter(c=>(!f.q||String(c.name||'').toLowerCase().includes(f.q.toLowerCase())||String(c.id).includes(f.q))&&(f.currency==='all'||(c.isAd?'ad':c.currency)===f.currency)&&(f.category==='all'||String(c.category||'coins')===String(f.category)));arr.sort((a,b)=>(Number(a.requiredLevel)||0)-(Number(b.requiredLevel)||0)||Number(a.id)-Number(b.id));$('#tab-cases').innerHTML=`<div class="card"><div class="section-title"><h2>🎁 Кейсы</h2><span class="count">${arr.length}/${state.cases.length}</span><span style="flex:1"></span><button class="small" id="manageCaseFilters">🗂 Категории</button><button class="small ok" id="addCase">＋ Кейс</button></div><div class="hint">Меняй цену, уровень, опыт и таблицу выпадения вручную. Сумма шансов каждого кейса должна быть 100%. Для платных кейсов  целевой средний возврат — около 67% цены.</div><div class="toolbar" style="margin-top:8px"><button class="small" id="caseExport">💾 Скачать cases.json</button></div><div class="searchrow"><input id="caseQ" placeholder="🔎 Поиск кейса или ID" value="${esc(f.q)}"><select id="caseCur"><option value="all">Все валюты</option><option value="coins" ${f.currency==='coins'?'selected':''}>🪙 Монеты</option><option value="gems" ${f.currency==='gems'?'selected':''}>💎 Гемы</option><option value="ad" ${f.currency==='ad'?'selected':''}>📺 Реклама</option></select><select id="caseCategory"><option value="all">Все разделы</option>${(state.caseFilters||[]).filter(x=>x.id!=='all'&&x.id!=='available').map(x=>`<option value="${esc(x.id)}" ${f.category===x.id?'selected':''}>${esc(x.label)}</option>`).join('')}</select><button id="caseImport">📥 Импорт cases.json</button></div><div class="stats"><div class="stat"><b>${state.cases.length}</b>кейсов</div><div class="stat"><b>${state.cases.filter(x=>x.isAd).length}</b>реклама</div><div class="stat"><b>${state.cases.filter(x=>x.currency==='gems').length}</b>гемы</div><div class="stat"><b>${state.cases.filter(x=>!x.isAd&&x.currency==='coins').length}</b>монеты</div></div></div><div class="case-list">${arr.map(c=>caseCard(c)).join('')||'<div class="empty">Ничего не найдено.</div>'}</div>`;
$('#caseExport').onclick=()=>exportDb('cases');$('#manageCaseFilters').onclick=renderCaseCategoryManager;$('#caseQ').oninput=e=>{f.q=e.target.value;renderCases()};$('#caseCur').onchange=e=>{f.currency=e.target.value;renderCases()};$('#caseCategory').onchange=e=>{f.category=e.target.value;renderCases()};$('#caseImport').onclick=()=>importJson('cases');$('#addCase').onclick=()=>editCase(-1);document.querySelectorAll('[data-edit-case]').forEach(b=>b.onclick=()=>editCase(Number(b.dataset.editCase)));document.querySelectorAll('[data-del-case]').forEach(b=>b.onclick=()=>{const i=state.cases.findIndex(x=>Number(x.id)===Number(b.dataset.delCase));if(i>=0&&confirm('Удалить кейс?')){state.cases.splice(i,1);renderCases();toast('Кейс удалён')}});document.querySelectorAll('[data-export-cases]').forEach(b=>b.onclick=()=>exportDb('cases'));}
function caseCard(c){const sum=(c.dropTable||[]).reduce((s,d)=>s+Number(d.chance||0),0);return `<article class="case-card"><div class="case-head"><img class="case-img" src="${esc(c.image)}" onerror="this.style.opacity=.25"><div><div class="title">${esc(c.name||'Без названия')}</div><div class="sub">ID ${c.id} · ${c.isAd?'📺 Реклама':(c.currency==='gems'?'💎 Гемы':'🪙 Монеты')} · открывается с уровня ${c.requiredLevel??1}</div><span class="badge">${(c.dropTable||[]).length} выпадений · maxTier ${c.maxTier??'—'}${c.economyRatio?` · возврат ${Math.round(Number(c.economyRatio)*100)}%`:''}</span></div><button class="small" data-edit-case="${c.id}">✏️</button></div><div class="case-body"><div class="sumline"><span>Сумма шансов</span><b class="${Math.abs(sum-100)<.01?'sum-ok':'sum-bad'}">${sum.toFixed(2)}%</b></div><details><summary style="padding:10px 0 2px">Показать таблицу выпадения</summary><div class="hint" style="margin-top:8px">Формат: картинка → предмет → тир → шанс → удалить.</div><div class="drop-list">${(c.dropTable||[]).slice(0,8).map(d=>`<div class="drop-row"><span class="drop-row-atlas">${itemSprite(itemById(d.itemId)?.image||d.itemId,'drop-row-item')}</span><div>${esc(itemById(d.itemId)?.name||'ID '+d.itemId)}</div><div class="tier ${tierClass(d.tier)}">T${d.tier}</div><div style="text-align:right">${Number(d.chance||0).toFixed(2)}%</div><div> </div></div>`).join('')}</div>${(c.dropTable||[]).length>8?`<div class="hint" style="margin-top:6px">…ещё ${(c.dropTable||[]).length-8}. Для редактирования открой ✏️.</div>`:''}</details></div></article>`}
function editCase(id){let c=id<0?{id:Math.max(0,...state.cases.map(x=>Number(x.id)||0))+1,name:'Новый кейс',image:'png/cases/case_1.png',borderColor:'#ffffff',price:100,currency:'coins',isAd:false,maxTier:1,requiredLevel:1,exp:[20,40],rating:[1,2],category:state.caseFilters?.find(x=>x.id!=='all')?.id||state.caseFilters?.[0]?.id||'all',dropTable:state.items.length?[{itemId:state.items[0].id,tier:1,chance:100}]:[]}:clone(state.cases.find(x=>Number(x.id)===id));if(!c)return;openModal('Кейс · ID '+c.id,()=>caseForm(c,id<0))}
function caseForm(c,isNew){const drops=c.dropTable||[];return `<div class="grid2"><div class="field"><label>Название</label><input id="cName" value="${esc(c.name)}"></div><div class="field"><label>ID кейса</label><input id="cId" type="number" value="${c.id}"></div></div><div class="field"><label>Картинка</label><input id="cImage" value="${esc(c.image)}"></div><div class="grid3"><div class="field"><label>Цена</label><input id="cPrice" type="number" value="${c.price??0}"></div><div class="field"><label>Валюта</label><select id="cCurrency"><option value="coins" ${c.currency==='coins'?'selected':''}>Монеты</option><option value="gems" ${c.currency==='gems'?'selected':''}>Гемы</option><option value="ad" ${c.currency==='ad'?'selected':''}>Реклама</option></select></div><div class="field"><label>Уровень</label><input id="cLevel" type="number" min="1" value="${c.requiredLevel??1}"></div></div><div class="grid2"><div class="field"><label>Опыт min</label><input id="cExpMin" type="number" value="${c.exp?.[0]??0}"></div><div class="field"><label>Опыт max</label><input id="cExpMax" type="number" value="${c.exp?.[1]??0}"></div></div><div class="grid2"><div class="field"><label>Рейтинг min</label><input id="cRatingMin" type="number" min="0" value="${c.rating?.[0]??1}"></div><div class="field"><label>Рейтинг max</label><input id="cRatingMax" type="number" min="0" value="${c.rating?.[1]??2}"></div></div><div class="field"><label>Раздел сортировки</label><select id="cCategory">${(state.caseFilters||[]).filter(x=>x.id!=='all'&&x.id!=='available').map(x=>`<option value="${esc(x.id)}" ${String(c.category||'coins')===String(x.id)?'selected':''}>${esc(x.label)}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Цвет рамки кейса</label><input id="cColor" value="${esc(c.borderColor||'#ffffff')}"></div><div class="field"><label>Рекламный кейс</label><select id="cAd"><option value="false" ${!c.isAd?'selected':''}>Нет</option><option value="true" ${c.isAd?'selected function wireDropEditor(c){const box=$('#dropEditor');const update=()=>{$('#dropSum').innerHTML='<span>Сумма</span><b class="'+(Math.abs((c.dropTable||[]).reduce((s,d)=>s+Number(d.chance||0),0)-100)<.01?'sum-ok':'sum-bad')+'">'+(c.dropTable||[]).reduce((s,d)=>s+Number(d.chance||0),0).toFixed(2)+'%</b>'};box.querySelectorAll('select,input').forEach(el=>el.oninput=el.onchange=e=>{const i=Number(el.dataset.drop),field=el.dataset.field;if(!c.dropTable[i])return;if(field==='category'){const cat=el.value;const list=state.items.filter(x=>String(x.category)===String(cat)).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ru')||Number(a.id)-Number(b.id));const itemSelect=box.querySelector(`select[data-drop="${i}"][data-field="itemId"]`);if(itemSelect){itemSelect.innerHTML=optionItems(list[0]?.id||0,cat);c.dropTable[i].itemId=Number(list[0]?.id||0);const img=$('#dropImg'+i)?.querySelector('.item-atlas');if(img)setItemAtlasElement(img,itemById(c.dropTable[i].itemId)?.image||c.dropTable[i].itemId)}}else if(field==='itemId'){c.dropTable[i].itemId=Number(el.value);const img=$('#dropImg'+i)?.querySelector('.item-atlas');if(img)setItemAtlasElement(img,itemById(c.dropTable[i].itemId)?.image||c.dropTable[i].itemId)}else if(field==='tier')c.dropTable[i].tier=Number(el.value);else c.dropTable[i].chance=Math.max(0,Number(el.value)||0);update()});box.querySelectorAll('[data-remove-drop]').forEach(b=>b.onclick=()=>{c.dropTable.splice(Number(b.dataset.removeDrop),1);$('#dropEditor').innerHTML=c.dropTable.map((d,i)=>dropEditorRow(d,i)).join('');$('#dropCount').textContent=c.dropTable.length;wireDropEditor(c)});update()}
function saveCaseFromModal(){const id=Number($('#cId').value)||1;const c={id,name:$('#cName').value.trim()||'Кейс',image:$('#cImage').value.trim(),borderColor:$('#cColor').value.trim()||'#ffffff',price:Math.max(0,Number($('#cPrice').value)||0),currency:$('#cCurrency').value,isAd:$('#cAd').value==='true',maxTier:Math.max(1,...(currentCase.dropTable||[]).map(d=>Number(d.tier)||1)),requiredLevel:Math.max(1,Number($('#cLevel').value)||1),exp:[Math.max(0,Number($('#cExpMin').value)||0),Math.max(0,Number($('#cExpMax').value)||0)],rating:[Math.max(0,Number($('#cRatingMin').value)||0),Math.max(0,Number($('#cRatingMax').value)||0)],category:$('#cCategory').value||state.caseFilters?.[0]?.id||'all',dropTable:currentCase.dropTable,economyRatio:Number(currentCase.economyRatio)||undefined};if(c.currency==='ad')c.isAd=true;if(c.isAd)c.currency='ad';const old=state.cases.findIndex(x=>Number(x.id)===id);if(old>=0)state.cases[old]=c;else state.cases.push(c);closeModal();renderCases();autoSaveDraft();toast('Кейс сохранён')}

${r.day}" data-del-reward-item-index="${i}">✕</button></div>`).join('')||'<div class="hint">Нет предметов</div>'}</div><button class="small danger" data-del-reward="${r.day}">Удалить день</button></div></article>`).join('')||'<div class="empty">Ничего не найдено.</div>'}</div>`;$('#rewardExport').onclick=()=>exportDb('rewards');$('#rewardQ').oninput=e=>{f.q=e.target.value;renderRewards()};$('#rewardImport').onclick=()=>importJson('rewards');$('#addReward').onclick=()=>{state.rewards.push({day:Math.max(0,...state.rewards.map(x=>Number(x.day)||0))+1,coins:0,gems:0,items:[]});renderRewards();autoSaveDraft();toast('День добавлен')};document.querySelectorAll('[data-reward]').forEach(el=>el.onchange=()=>{const r=state.rewards.find(x=>Number(x.day)===Number(el.dataset.reward));if(r){r[el.dataset.field]=Math.max(0,Number(el.value)||0);autoSaveDraft()}});document.querySelectorAll('[data-add-reward-item]').forEach(b=>b.onclick=()=>{const r=state.rewards.find(x=>Number(x.day)===Number(b.dataset.addRewardItem));if(r){r.items=Array.isArray(r.items)?r.items:[];r.items.push({itemId:state.items[0]?.id||1,tier:1,count:1});renderRewards();autoSaveDraft()}});document.querySelectorAll('[data-ri]').forEach(el=>el.onchange=()=>{const r=state.rewards.find(x=>Number(x.day)===Number(el.dataset.ri));if(r&&r.items?.[Number(el.dataset.rii)]){const x=r.items[Number(el.dataset.rii)];x[el.dataset.rif]=Math.max(1,Number(el.value)||1);if(el.dataset.rif==='tier')x.tier=Math.min(6,x.tier);autoSaveDraft()}});document.querySelectorAll('[data-del-reward-item]').forEach(b=>b.onclick=()=>{const r=state.rewards.find(x=>Number(x.day)===Number(b.dataset.delRewardItem));if(r){r.items.splice(Number(b.dataset.delRewardItemIndex),1);renderRewards();autoSaveDraft()}});document.querySelectorAll('[data-del-reward]').forEach(b=>b.onclick=()=>{const i=state.rewards.findIndex(x=>Number(x.day)===Number(b.dataset.delReward));if(i>=0&&confirm('Удалить награду за день '+b.dataset.delReward+'?')){state.rewards.splice(i,1);renderRewards();autoSaveDraft();toast('День удалён')}})}

function renderPromos(){const arr=state.promos||[];$('#tab-promos').innerHTML=`<div class="card"><div class="section-title"><h2>🎟 Промокоды</h2><span class="count">${arr.length}</span><span style="flex:1"></span><button class="small ok" id="addPromo">＋ Промокод</button></div><div class="hint">Приватная база промокодов не загружается из публичной папки. Импортируй private-data/promo_codes.json вручную; после изменений скачай файл и замени приватную серверную копию.</div><div class="toolbar"><button class="small" id="promoImport">📥 Импорт promo_codes.json</button><button class="small" id="promoExport">💾 Скачать promo_codes.json</button></div></div><div class="case-list">${arr.map((x,i)=>`<article class="case-card"><div class="case-body"><div class="title">${esc(x.code||'КОД')}</div><div class="sub">${x.enabled===false?'ОТКЛЮЧЁН':'АКТИВЕН'} · ${money(x.coins||0)} 🪙 · ${Number(x.gems||0)} 💎 · ${Number(x.shards||0)} ◆</div><div class="case-actions" style="margin-top:8px"><button class="small" data-edit-promo="${i}">✏️</button><button class="small danger" data-del-promo="${i}">Удалить</button></div></div></article>`).join('')||'<div class="empty">Промокодов пока нет.</div>'}</div>`;$('#promoExport').onclick=()=>exportDb('promos');$('#promoImport').onclick=()=>importJson('promos');$('#addPromo').onclick=()=>editPromo(-1);document.querySelectorAll('[data-edit-promo]').forEach(b=>b.onclick=()=>editPromo(Number(b.dataset.editPromo)));document.querySelectorAll('[data-del-promo]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.delPromo);if(confirm('Удалить промокод?')){state.promos.splice(i,1);renderPromos();autoSaveDraft();toast('Промокод удалён')}})}
function editPromo(index){
  const x=index<0?{code:'NEWCODE',enabled:true,coins:0,gems:0,shards:0,items:[]}:clone(state.promos[index]);
  x.items=Array.isArray(x.items)?x.items:[];
  const expiryMs=x.expiresAt?Date.parse(x.expiresAt):NaN;
  const expiryInput=Number.isFinite(expiryMs)?new Date(expiryMs).toISOString().slice(0,16):'';
  const itemRows=()=>x.items.map((it,i)=>`<div class="req-row" data-promo-item-row="${i}"><select data-pi="${i}" data-pif="itemId">${optionItems(it.itemId)}</select><input data-pi="${i}" data-pif="tier" type="number" min="1" max="6" value="${Math.max(1,Math.min(6,Number(it.tier)||1))}"><input data-pi="${i}" data-pif="count" type="number" min="1" max="100" value="${Math.max(1,Math.min(100,Number(it.count)||1))}"><button type="button" class="small danger" data-del-promo-item="${i}">✕</button></div>`).join('');
  openModal('Промокод',()=>`<div class="field"><label>Код</label><input id="pCode" value="${esc(x.code||'')}"></div><div class="grid2"><div class="field"><label>Монеты 🪙</label><input id="pCoins" type="number" min="0" value="${x.coins||0}"></div><div class="field"><label>Гемы 💎</label><input id="pGems" type="number" min="0" value="${x.gems||0}"></div></div><div class="field"><label>Осколки ◆</label><input id="pShards" type="number" min="0" value="${x.shards||0}"></div><div class="field"><label>Истекает (необязательно)</label><input id="pExpires" type="datetime-local" value="${esc(expiryInput)}"></div><div class="field"><label>Активен</label><select id="pEnabled"><option value="true" ${x.enabled!==false?'selected':''}>Да</option><option value="false" ${x.enabled===false?'selected':''}>Нет</option></select></div><div class="card"><div class="section-title"><h2>Предметы</h2><span class="count" id="promoItemCount">${x.items.length}</span><span style="flex:1"></span><button type="button" class="small ok" id="addPromoItem">＋ Добавить</button></div><div class="hint">Выбери предмет, тир и количество. Эти награды экспортируются в приватный promo_codes.json.</div><div id="promoItemsEditor" class="required-list">${itemRows()||'<div class="hint">Нет предметных наград.</div>'}</div></div><div class="sticky-actions"><button type="button" class="ok" id="pSave">💾 Сохранить</button></div>`);
  const rerenderItems=()=>{const box=$('#promoItemsEditor');if(!box)return;box.innerHTML=itemRows()||'<div class="hint">Нет предметных наград.</div>';$('#promoItemCount').textContent=x.items.length;wirePromoItems();};
  const wirePromoItems=()=>{document.querySelectorAll('[data-pi]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.pi);const row=x.items[i];if(!row)return;const f=el.dataset.pif;row[f]=f==='itemId'?Number(el.value):Math.max(1,Math.min(f==='count'?100:6,Number(el.value)||1));autoSaveDraft();});document.querySelectorAll('[data-del-promo-item]').forEach(b=>b.onclick=()=>{x.items.splice(Number(b.dataset.delPromoItem),1);rerenderItems();autoSaveDraft();});};
  setTimeout(()=>{$('#addPromoItem').onclick=()=>{x.items.push({itemId:state.items[0]?.id||1,tier:1,count:1});rerenderItems();};wirePromoItems();$('#pSave').onclick=()=>{const out={code:$('#pCode').value.trim().toUpperCase(),enabled:$('#pEnabled').value==='true',coins:Math.max(0,Number($('#pCoins').value)||0),gems:Math.max(0,Number($('#pGems').value)||0),shards:Math.max(0,Number($('#pShards').value)||0),expiresAt:$('#pExpires').value?new Date($('#pExpires').value).toISOString():null,items:x.items.map(it=>({itemId:Number(it.itemId)||1,tier:Math.max(1,Math.min(6,Number(it.tier)||1)),count:Math.max(1,Math.min(100,Number(it.count)||1))}))};if(!out.code)return toast('Введите код','bad');if(index<0)state.promos.push(out);else state.promos[index]=out;closeModal();renderPromos();autoSaveDraft();toast('Промокод сохранён')};},0)
}

function openModal(title,bodyFn){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=bodyFn();$('#modal').classList.add('open')}
function closeModal(){currentCase=null;$('#modal').classList.remove('open');$('#modalBody').innerHTML=''}
$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function renderAll(){renderItems();renderCases();renderHouses();renderAvatars();renderRewards();renderPromos()}
// Загрузка баз
loadGameData();
</script>
</body>
</html>
